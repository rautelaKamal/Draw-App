services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drawapp
      POSTGRES_PASSWORD: drawapp_dev
      POSTGRES_DB: drawapp
    ports:
      # 5433 on the host to match packages/db/.env, since 5432 is often taken.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this the backends start before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U drawapp -d drawapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits. The backends wait for it, so they never start against
  # a schema that has not been applied yet.
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP: http-backend
    working_dir: /app
    command: pnpm --filter @repo/db exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://drawapp:drawapp_dev@postgres:5432/drawapp
    depends_on:
      postgres:
        condition: service_healthy

  http-backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP: http-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://drawapp:drawapp_dev@postgres:5432/drawapp
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully

  ws-backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP: ws-backend
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://drawapp:drawapp_dev@postgres:5432/drawapp
      # Must match http-backend, or tokens signed by one fail on the other.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # These are the addresses the BROWSER uses, so they are localhost, not
        # the compose service names -- service names only resolve between
        # containers, and this code runs on the user's machine.
        NEXT_PUBLIC_HTTP_BACKEND: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - http-backend
      - ws-backend

volumes:
  postgres-data:
